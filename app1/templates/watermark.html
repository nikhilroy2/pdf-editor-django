<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Watermark</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 p-3">
                                <i class="bi bi-stamp fs-2"></i>
                            </div>
                            <h1 class="h4 fw-bold mb-1">PDF Watermark</h1>
                            <p class="text-muted small mb-0">Apply custom text watermarks to all pages</p>
                        </div>

                        <!-- Form -->
                        <form id="watermarkForm" onsubmit="return false;">

                            <!-- 1. PDF File Upload -->
                            <div class="mb-3">
                                <label for="pdfInput" class="form-label fw-semibold small">Upload PDF File</label>
                                <input type="file" class="form-control" id="pdfInput" accept=".pdf" required>
                                <div class="form-text small" id="fileInfo">Only .pdf files are supported</div>
                            </div>

                            <!-- 2. Watermark Text -->
                            <div class="mb-3">
                                <label for="watermarkText" class="form-label fw-semibold small">Watermark Text</label>
                                <input type="text" class="form-control" id="watermarkText" value="CONFIDENTIAL" placeholder="e.g. CONFIDENTIAL" required>
                            </div>

                            <!-- 3. Position -->
                            <div class="mb-3">
                                <label for="position" class="form-label fw-semibold small">Position</label>
                                <select class="form-select" id="position">
                                    <option value="center" selected>Center (Diagonal)</option>
                                    <option value="top-left">Top Left</option>
                                    <option value="top-center">Top Center</option>
                                    <option value="top-right">Top Right</option>
                                    <option value="bottom-left">Bottom Left</option>
                                    <option value="bottom-center">Bottom Center</option>
                                    <option value="bottom-right">Bottom Right</option>
                                </select>
                            </div>

                            <!-- 4. Opacity Slider -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="opacity" class="form-label fw-semibold small mb-0">Opacity</label>
                                    <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold" id="opacityVal">0.25</span>
                                </div>
                                <input type="range" class="form-range" id="opacity" min="0.05" max="1.0" step="0.05" value="0.25">
                            </div>

                            <!-- 5. Watermark Color -->
                            <div class="mb-4">
                                <label for="colorPicker" class="form-label fw-semibold small">Watermark Color</label>
                                <div class="input-group">
                                    <input type="color" class="form-control form-control-color p-1" id="colorPicker" value="#FF0000" title="Choose color" style="max-width: 48px;">
                                    <input type="text" class="form-control font-monospace" id="colorHex" value="#FF0000" maxlength="7" placeholder="#FF0000">
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="button" class="btn btn-primary py-2 fw-semibold" id="submitBtn" disabled>
                                    <span class="spinner-border spinner-border-sm me-2 d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                                    <span id="btnText"><i class="bi bi-shield-check me-1"></i> Apply Watermark</span>
                                </button>
                            </div>

                        </form>

                        <!-- Bootstrap Alert Status Box -->
                        <div class="alert d-none mt-3 mb-0 small" id="statusBox" role="alert"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const pdfInput = document.getElementById('pdfInput');
        const watermarkText = document.getElementById('watermarkText');
        const positionSelect = document.getElementById('position');
        const opacityInput = document.getElementById('opacity');
        const opacityVal = document.getElementById('opacityVal');
        const colorPicker = document.getElementById('colorPicker');
        const colorHex = document.getElementById('colorHex');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const statusBox = document.getElementById('statusBox');
        const fileInfo = document.getElementById('fileInfo');

        let selectedFile = null;

        // Opacity live counter
        opacityInput.addEventListener('input', (e) => {
            opacityVal.textContent = parseFloat(e.target.value).toFixed(2);
        });

        // Sync color picker with hex text input
        colorPicker.addEventListener('input', (e) => {
            colorHex.value = e.target.value.toUpperCase();
        });

        colorHex.addEventListener('input', (e) => {
            let val = e.target.value.trim();
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                colorPicker.value = val;
            }
        });

        // File selection & validation
        pdfInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const file = e.target.files[0];
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    setStatus('Please select a valid .pdf file.', 'danger');
                    submitBtn.disabled = true;
                    selectedFile = null;
                    return;
                }
                selectedFile = file;
                fileInfo.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                submitBtn.disabled = false;
                statusBox.classList.add('d-none');
            } else {
                selectedFile = null;
                submitBtn.disabled = true;
                fileInfo.textContent = 'Only .pdf files are supported';
            }
        });

        function setStatus(message, type) {
            statusBox.className = `alert alert-${type} mt-3 mb-0 small`;
            statusBox.innerHTML = message;
            statusBox.classList.remove('d-none');
        }

        // Apply watermark handler
        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const text = watermarkText.value.trim();
            if (!text) {
                setStatus('Please enter watermark text.', 'danger');
                return;
            }

            let hex = colorHex.value.trim();
            if (!hex.startsWith('#')) hex = '#' + hex;
            if (!/^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(hex)) {
                setStatus('Please enter a valid hex color (e.g. #FF0000).', 'danger');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Applying Watermark...';
            setStatus('<i class="bi bi-hourglass-split me-1"></i> Processing your PDF, please wait...', 'info');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('text', text);
            formData.append('position', positionSelect.value);
            formData.append('opacity', opacityInput.value);
            formData.append('color', hex);

            try {
                const response = await fetch('/api/editor/pdf/watermark', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errMsg = 'Failed to apply watermark.';
                    try {
                        const err = await response.json();
                        errMsg = err.error || Object.values(err)[0] || errMsg;
                        if (typeof errMsg === 'object') errMsg = JSON.stringify(errMsg);
                    } catch (e) {}
                    throw new Error(errMsg);
                }

                // Trigger direct file download
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `watermarked_${selectedFile.name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                setStatus('<i class="bi bi-check-circle-fill me-1"></i> Success! Your watermarked PDF has been downloaded.', 'success');
            } catch (err) {
                setStatus('<i class="bi bi-exclamation-triangle-fill me-1"></i> ' + (err.message || 'An error occurred while watermarking.'), 'danger');
            } finally {
                submitBtn.disabled = false;
                btnSpinner.classList.add('d-none');
                btnText.innerHTML = '<i class="bi bi-shield-check me-1"></i> Apply Watermark';
            }
        });
    </script>
</body>
</html>
