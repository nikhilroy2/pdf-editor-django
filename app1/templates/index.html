<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Translator</title>
    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 p-3">
                                <i class="bi bi-file-earmark-pdf fs-2"></i>
                            </div>
                            <h1 class="h4 fw-bold mb-1">PDF Translator</h1>
                            <p class="text-muted small mb-0">Translate your PDF between English and Bangla</p>
                        </div>

                        <!-- Form -->
                        <form id="translateForm" onsubmit="return false;">
                            <!-- Translation Direction -->
                            <div class="mb-3">
                                <label for="direction" class="form-label fw-semibold small">Translation Direction</label>
                                <select id="direction" class="form-select">
                                    <option value="en-bn" selected>English &rarr; Bangla (বাংলা)</option>
                                    <option value="bn-en">Bangla (বাংলা) &rarr; English</option>
                                </select>
                            </div>

                            <!-- PDF File Input -->
                            <div class="mb-4">
                                <label for="pdfInput" class="form-label fw-semibold small">Upload PDF</label>
                                <input type="file" class="form-control" id="pdfInput" accept=".pdf" required>
                                <div class="form-text small" id="fileHelp">Only .pdf files are supported</div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="button" class="btn btn-primary py-2 fw-semibold" id="submitBtn" disabled>
                                    <span class="spinner-border spinner-border-sm me-2 d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                                    <span id="btnText"><i class="bi bi-translate me-1"></i> Translate PDF</span>
                                </button>
                            </div>
                        </form>

                        <!-- Bootstrap Alert Box -->
                        <div class="alert d-none mt-3 mb-0 small" id="statusBox" role="alert"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const pdfInput = document.getElementById('pdfInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const directionSelect = document.getElementById('direction');
        const statusBox = document.getElementById('statusBox');

        let selectedFile = null;

        // Handle file selection
        pdfInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const file = e.target.files[0];
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    setStatus('Please choose a valid .pdf file.', 'danger');
                    submitBtn.disabled = true;
                    selectedFile = null;
                    return;
                }
                selectedFile = file;
                submitBtn.disabled = false;
                statusBox.classList.add('d-none');
            } else {
                selectedFile = null;
                submitBtn.disabled = true;
            }
        });

        // Set Bootstrap alert status
        function setStatus(message, type) {
            statusBox.className = `alert alert-${type} mt-3 mb-0 small`;
            statusBox.innerHTML = message;
            statusBox.classList.remove('d-none');
        }

        // Submit form
        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const [sourceLang, targetLang] = directionSelect.value.split('-');

            // Update UI to loading state
            submitBtn.disabled = true;
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Translating...';
            setStatus('<i class="bi bi-hourglass-split me-1"></i> Translating PDF... please wait.', 'info');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('source_language', sourceLang);
            formData.append('target_language', targetLang);

            try {
                const response = await fetch('/api/translate-pdf/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errMsg = 'Failed to translate PDF.';
                    try {
                        const err = await response.json();
                        errMsg = err.error || Object.values(err)[0] || errMsg;
                    } catch (e) {}
                    throw new Error(errMsg);
                }

                // Download translated PDF file
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `translated_${targetLang}_${selectedFile.name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                setStatus('<i class="bi bi-check-circle-fill me-1"></i> Completed! Your translated PDF has been downloaded.', 'success');
            } catch (err) {
                setStatus('<i class="bi bi-exclamation-triangle-fill me-1"></i> ' + (err.message || 'An error occurred during translation.'), 'danger');
            } finally {
                submitBtn.disabled = false;
                btnSpinner.classList.add('d-none');
                btnText.innerHTML = '<i class="bi bi-translate me-1"></i> Translate PDF';
            }
        });
    </script>
</body>
</html>
